<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <title>Device QR Reader</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Device QR Reader <span class="ver">v5<span id="offlineTag" hidden> · 오프라인</span></span></h1>
      <button id="installBtn" class="install" hidden>📲 앱 설치</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-mode="register">① 등록</button>
      <button class="tab" data-mode="check">② 확인</button>
      <button class="tab" data-mode="label">③ 라벨</button>
    </div>
  </header>

  <!-- 카메라 -->
  <section id="scannerView" class="scanner">
    <div id="videoWrap" class="video-wrap">
      <video id="video" playsinline muted></video>
      <div class="aim"></div>
      <div id="ocrBand" class="ocr-band"><span>라벨 글자를 이 띠에 맞추세요</span></div>
      <div id="videoPlaceholder" class="placeholder">아래 [스캔 시작]을 눌러 주세요</div>
    </div>

    <div class="cam-controls">
      <button id="startBtn" class="primary">스캔 시작</button>
      <button id="stopBtn" hidden>중지</button>
      <button id="ocrBtn" hidden title="글자 인식(OCR)">🔤</button>
      <button id="torchBtn" hidden title="플래시">🔦</button>
      <select id="cameraSelect" hidden title="카메라 선택"></select>
    </div>
    <div id="zoomRow" class="zoom-row" hidden>
      <span>줌</span>
      <input id="zoomRange" type="range" />
    </div>
    <label id="multiRow" class="opt-row">
      <input id="multiChk" type="checkbox" />
      여러 개 동시 인식 <small>(기기를 나란히 놓고 한 번에 등록)</small>
    </label>

    <div id="status" class="status idle">
      <div class="status-line">
        <div id="statusMain" class="status-main">등록 모드</div>
        <div id="remain" class="remain" hidden></div>
      </div>
      <div id="statusSub" class="status-sub">기기 코드를 순서 상관없이 스캔하면 오름차순으로 정렬됩니다</div>
    </div>

    <!-- 글자 인식(OCR): 코드가 훼손됐을 때 보조용 -->
    <div id="ocrPanel" class="ocr-panel" hidden>
      <button id="ocrReadBtn" class="primary">📷 글자 읽기</button>
      <img id="ocrPreview" class="ocr-preview" alt="" hidden />
      <div id="ocrRaw" class="ocr-raw"></div>
      <div id="ocrCands" class="ocr-cands"></div>
    </div>
  </section>

  <!-- Serial 목록 -->
  <section id="listView" class="list">
    <div class="list-head">
      <h2>Serial 목록 <span id="countBadge" class="badge">0</span></h2>
      <div class="list-actions">
        <button id="resetMarksBtn" hidden>표시 초기화</button>
        <button id="clearBtn" class="danger">전체 삭제</button>
      </div>
    </div>

    <div class="manual">
      <input id="manualInput" type="text" autocapitalize="characters" autocomplete="off"
             placeholder="직접 입력 후 Enter" />
      <button id="manualBtn">입력</button>
    </div>

    <details id="pasteBox" class="paste">
      <summary>여러 개 한 번에 붙여넣기</summary>
      <textarea id="pasteArea" rows="5" placeholder="한 줄에 하나씩 (메신저·메일에서 복사한 목록)"></textarea>
      <button id="pasteBtn" class="primary">목록에 추가</button>
    </details>

    <table>
      <thead>
        <tr>
          <th>Serial</th>
          <th>No.</th>
          <th>indicator</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p id="emptyMsg" class="empty">등록된 Serial이 없습니다</p>
  </section>

  <!-- 라벨 만들기 -->
  <section id="labelView" class="labels" hidden>
    <div class="label-form">
      <label for="labelText" class="field-title">라벨 내용 <small>(한 줄에 하나)</small></label>
      <textarea id="labelText" rows="6" placeholder="예) ZIT3519M&#10;보관함-01"></textarea>
      <div class="row">
        <button id="labelFromList">등록 목록 불러오기</button>
        <button id="labelClear">지우기</button>
      </div>
      <div class="row">
        <label>코드
          <select id="labelFormat">
            <option value="DataMatrix">Data Matrix</option>
            <option value="QRCode">QR</option>
          </select>
        </label>
        <label>크기
          <select id="labelSize">
            <option value="10">10mm</option>
            <option value="15">15mm</option>
            <option value="20" selected>20mm</option>
            <option value="30">30mm</option>
            <option value="45">45mm</option>
          </select>
        </label>
      </div>
      <label class="chk"><input id="labelShowText" type="checkbox" checked /> 코드 아래 글자 표시</label>
      <button id="labelMake" class="primary">라벨 만들기</button>
    </div>

    <div id="labelActions" class="label-actions" hidden>
      <span id="labelCount"></span>
      <button id="labelPrint" class="primary">🖨 인쇄 / PDF 저장</button>
    </div>
    <div id="labelSheet" class="label-sheet"></div>
  </section>

  <!-- ZXing: QR / Data Matrix 인식·생성 (zxing_full.wasm 파일과 함께 사용) -->
  <script src="zxing-full.js"></script>
  <script src="script.js"></script>
</body>
</html>
